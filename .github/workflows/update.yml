name: Update ESD Links

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cabextract
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cabextract

      - name: Fetch & generate README
        run: python3 scripts/update.py

      - name: Commit & push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet || git commit -m "🔄 update: latest ESD links [skip ci]"
          git push
